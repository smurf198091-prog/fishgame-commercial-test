services:
  - type: web
    name: fishgame-commercial-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: APP_ENV
        value: commercial-test
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /tmp/fishgame-data
