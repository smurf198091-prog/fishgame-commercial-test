<script>
(function(){
  function fitGame(){
    var designW = 980, designH = 545;
    var scale = Math.min(window.innerWidth / designW, window.innerHeight / designH);
    var middle = document.getElementById('middle');
    if(middle){ middle.style.transform = 'scale(' + scale + ')'; }
    var tip = document.getElementById('fitTip');
    if(tip){ tip.textContent = 'fit ' + Math.round(scale * 100) + '%'; }
  }
  window.addEventListener('resize', fitGame);
  window.addEventListener('orientationchange', fitGame);
  window.addEventListener('load', fitGame);
})();
</script>

<script id="githubPagesFitV7">
(function(){
  function fitGame(){
    var designW = 980, designH = 545;
    var vw = window.innerWidth || document.documentElement.clientWidth || screen.width;
    var vh = window.innerHeight || document.documentElement.clientHeight || screen.height;
    var middle = document.getElementById('middle');
    var outer = document.getElementById('outer');
    if(!middle) return;
    middle.style.position = 'absolute';
    middle.style.left = '50%';
    middle.style.top = '50%';
    middle.style.width = designW + 'px';
    middle.style.height = designH + 'px';
    middle.style.transformOrigin = 'center center';
    if(outer){ outer.style.position='fixed'; outer.style.inset='0'; outer.style.overflow='hidden'; outer.style.background='#000'; }
    if(vh > vw){
      var s = Math.min(vw / designH, vh / designW);
      middle.style.transform = 'translate(-50%, -50%) rotate(90deg) scale(' + s + ')';
    }else{
      var s2 = Math.min(vw / designW, vh / designH);
      middle.style.transform = 'translate(-50%, -50%) scale(' + s2 + ')';
    }
  }
  function wake(){ setTimeout(fitGame,0); setTimeout(fitGame,250); setTimeout(fitGame,1000); }
  window.addEventListener('resize', wake, {passive:true});
  window.addEventListener('orientationchange', wake, {passive:true});
  window.addEventListener('load', wake, {passive:true});
  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive:false});
})();
</script>
