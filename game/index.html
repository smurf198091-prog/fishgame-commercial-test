(function(){
  function fitGame(){
    var designW = 980, designH = 545;
    var scale = Math.min(window.innerWidth / designW, window.innerHeight / designH);
    var middle = document.getElementById('middle');
    if(middle){ middle.style.transform = 'scale(' + scale + ')'; }
    var tip = document.getElementById('fitTip');
    if(tip){ tip.textContent = 'fit ' + Math.round(scale * 100) + '%'; }
  }
  window.addEventListener('resize', fitGame);
  window.addEventListener('orientationchange', fitGame);
  window.addEventListener('load', fitGame);
})();
</script>

<script id="orientationSwitchV9">
(function(){
  var DESIGN_W=980, DESIGN_H=545;
  function getMode(){
    var q = new URLSearchParams(location.search);
    var m = q.get('orient') || localStorage.getItem('fishgame-orient') || 'auto';
    return /^(auto|landscape|portrait)$/.test(m) ? m : 'auto';
  }
  function setMode(m){ localStorage.setItem('fishgame-orient', m); fitGame(); }
  function actualMode(){
    var m=getMode();
    if(m==='auto') return window.innerHeight > window.innerWidth ? 'portrait' : 'landscape';
    return m;
  }
  function fitGame(){
    var vw=window.innerWidth||document.documentElement.clientWidth||screen.width;
    var vh=window.innerHeight||document.documentElement.clientHeight||screen.height;
    var middle=document.getElementById('middle');
    var btn=document.getElementById('rotateBtn');
    if(!middle) return;
    middle.style.width=DESIGN_W+'px'; middle.style.height=DESIGN_H+'px';
    var mode=actualMode();
    if(mode==='portrait'){
      var s=Math.min(vw/DESIGN_H, vh/DESIGN_W);
      middle.style.transform='translate(-50%, -50%) rotate(90deg) scale('+s+')';
      if(btn) btn.textContent='切横屏';
    }else{
      var s2=Math.min(vw/DESIGN_W, vh/DESIGN_H);
      middle.style.transform='translate(-50%, -50%) scale('+s2+')';
      if(btn) btn.textContent='切竖屏';
    }
  }
  function installButton(){
    if(document.getElementById('rotateBtn')) return;
    var b=document.createElement('button');
    b.id='rotateBtn'; b.type='button';
    b.onclick=function(){ setMode(actualMode()==='portrait' ? 'landscape' : 'portrait'); };
    document.body.appendChild(b); fitGame();
  }
  function wake(){ setTimeout(fitGame,0); setTimeout(fitGame,250); setTimeout(fitGame,1000); }
  window.addEventListener('resize',wake,{passive:true});
  window.addEventListener('orientationchange',wake,{passive:true});
  window.addEventListener('load',function(){installButton(); wake();},{passive:true});
  document.addEventListener('touchmove',function(e){ if(e.target && e.target.id!=='rotateBtn') e.preventDefault(); },{passive:false});
})();
</script>
</head>

<script id="mobileTouchFireV11">
(function(){
  var DESIGN_W = 980, DESIGN_H = 545;
  var lastFire = 0, touching = false, lastPoint = null, fireTimer = null;
  function mode(){
    var q = new URLSearchParams(location.search);
    var m = q.get('orient') || localStorage.getItem('fishgame-orient') || 'auto';
    if(m === 'auto') return window.innerHeight > window.innerWidth ? 'portrait' : 'landscape';
    return m === 'portrait' ? 'portrait' : 'landscape';
  }
  function toGamePoint(clientX, clientY){
    var vw = window.innerWidth || document.documentElement.clientWidth || screen.width;
    var vh = window.innerHeight || document.documentElement.clientHeight || screen.height;
    var dx = clientX - vw / 2, dy = clientY - vh / 2;
    if(mode() === 'portrait'){
      var s = Math.min(vw / DESIGN_H, vh / DESIGN_W);
      return {x: dy / s + DESIGN_W / 2, y: -dx / s + DESIGN_H / 2};
    }
    var s2 = Math.min(vw / DESIGN_W, vh / DESIGN_H);
    return {x: dx / s2 + DESIGN_W / 2, y: dy / s2 + DESIGN_H / 2};
  }
  function game(){ return window.fish && window.fish.game; }
  function canUse(el){ return !(el && (el.id === 'rotateBtn' || el.tagName === 'BUTTON')); }
  function clampPoint(p){
    return {x: Math.max(0, Math.min(DESIGN_W, p.x)), y: Math.max(0, Math.min(DESIGN_H, p.y))};
  }
  function aimAt(p){
    var g = game();
    if(!g || !g.player || !g.player.cannon || !window.fish.Utils) return;
    p = clampPoint(p); lastPoint = p;
    try{
      var cannon = g.player.cannon;
      var dir = window.fish.Utils.calcDirection(cannon, p), degree = dir.degree;
      if(degree == -90) degree = 0;
      else if(degree < 0 && degree > -90) degree = -degree;
      else if(degree >= 180 && degree <= 270) degree = 180 - degree;
      cannon.rotation = degree;
    }catch(e){ console.log('aim failed', e); }
  }
  function fireAt(p, force){
    var g = game();
    if(!g || !g.player || typeof g.player.fire !== 'function') return;
    var now = Date.now();
    if(!force && now - lastFire < 120) return;
    p = clampPoint(p); lastFire = now;
    try{ g.fireCount = g.fireInterval || 0; g.player.fire(p); }catch(e){ console.log('fire failed', e); }
  }
  function handle(clientX, clientY, target, fire){
    if(!canUse(target)) return;
    var p = toGamePoint(clientX, clientY);
    aimAt(p);
    if(fire) fireAt(p, false);
  }
  function startLoop(){
    if(fireTimer) return;
    fireTimer = setInterval(function(){ if(touching && lastPoint) fireAt(lastPoint, false); }, 130);
  }
  function stopLoop(){ touching=false; lastPoint=null; if(fireTimer){ clearInterval(fireTimer); fireTimer=null; } }
  document.addEventListener('touchstart', function(e){
    if(!e.touches || !e.touches.length) return;
    touching = true; startLoop();
    var t = e.touches[0]; handle(t.clientX, t.clientY, e.target, true);
    if(canUse(e.target)) e.preventDefault();
  }, {passive:false, capture:true});
  document.addEventListener('touchmove', function(e){
    if(!e.touches || !e.touches.length) return;
    var t = e.touches[0]; handle(t.clientX, t.clientY, e.target, true);
    if(canUse(e.target)) e.preventDefault();
  }, {passive:false, capture:true});
  document.addEventListener('touchend', stopLoop, {passive:true, capture:true});
  document.addEventListener('touchcancel', stopLoop, {passive:true, capture:true});
  document.addEventListener('mousedown', function(e){ touching=true; startLoop(); handle(e.clientX,e.clientY,e.target,true); }, true);
  document.addEventListener('mousemove', function(e){ if(touching) handle(e.clientX,e.clientY,e.target,true); }, true);
  document.addEventListener('mouseup', stopLoop, true);
})();
</script>
