<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>捕鱼游戏</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}
    iframe{border:0;width:100vw;height:100svh;min-height:100svh;background:#000}
    .bar{position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:20;display:none;gap:8px}
    button{border:0;border-radius:999px;background:rgba(55,162,255,.62);color:#00182d;font-weight:900;padding:5px 9px;font-size:13px}.toggle{position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:21;width:34px;height:34px;padding:0;background:rgba(255,214,107,.62)}
  </style>
</head>
<body>
  <iframe id="gameFrame" src="./game/?v=13" allow="fullscreen; autoplay; gamepad"></iframe>
  <button class="toggle" onclick="toggleBar()">☰</button><div class="bar" id="bar"><button onclick="go('auto')">自动</button><button onclick="go('landscape')">横屏</button><button onclick="go('portrait')">竖屏</button></div>
  <script>
    function go(m){ localStorage.setItem('fishgame-orient',m); document.getElementById('gameFrame').src='./game/?v=13&orient='+m+'&t='+Date.now(); }
  function toggleBar(){var b=document.getElementById("bar");b.style.display=b.style.display==="flex"?"none":"flex";}</script>
</body>
</html>
