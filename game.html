<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>捕鱼游戏</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}
    iframe{border:0;width:100vw;height:100dvh;min-height:100vh;background:#000}
    .bar{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:8px}
    button{border:0;border-radius:999px;background:rgba(55,162,255,.9);color:#00182d;font-weight:900;padding:8px 12px}
  </style>
</head>
<body>
  <iframe id="gameFrame" src="./game/?v=10" allow="fullscreen; autoplay; gamepad"></iframe>
  <div class="bar">
    <button onclick="go('auto')">自动</button>
    <button onclick="go('landscape')">横屏</button>
    <button onclick="go('portrait')">竖屏</button>
  </div>
  <script>
    function go(m){ localStorage.setItem('fishgame-orient',m); document.getElementById('gameFrame').src='./game/?v=9&orient='+m+'&t='+Date.now(); }
  </script>
</body>
</html>
